name: Testnet CD Pipeline

on:
  push:
    branches: [main]

jobs:
  deploy-testnet:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    # Manual approval gate: requires a reviewer configured on the `testnet`
    # environment in repository settings before any deploy steps run.
    environment: testnet
    defaults:
      run:
        working-directory: ./payment_router
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./payment_router

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Build contract to WASM
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Deploy to Testnet
        run: |
          # Generate deployer keypair
          stellar keys generate deployer --network testnet
          
          # Fund the deployer account
          stellar keys fund deployer --network testnet
          
          # Deploy contract
          CONTRACT_ID=$(stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/payment_router.wasm \
            --source deployer \
            --network testnet)
          
          # Output to GitHub Step Summary
          echo "### 🚀 Output from Testnet Deployment" >> $GITHUB_STEP_SUMMARY
          echo "**Contract ID**: \`$CONTRACT_ID\`" >> $GITHUB_STEP_SUMMARY

      - name: Post-Deploy Health Check
        env:
          TESTNET_API_URL: ${{ secrets.TESTNET_API_URL }}
        run: |
          if [ -z "$TESTNET_API_URL" ]; then
            echo "::error::TESTNET_API_URL repository secret is not configured."
            exit 1
          fi

          HEALTH_URL="${TESTNET_API_URL%/}/health"
          RESPONSE_FILE=$(mktemp)

          HTTP_STATUS=$(curl --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --output "$RESPONSE_FILE" --write-out "%{http_code}" \
            "$HEALTH_URL")

          BODY=$(cat "$RESPONSE_FILE")
          rm -f "$RESPONSE_FILE"

          echo "Health check HTTP status: $HTTP_STATUS"
          echo "Health check response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Post-deploy health check failed: expected HTTP 200, got $HTTP_STATUS"
            exit 1
          fi

          if ! echo "$BODY" | jq -e '(.status | type == "string") and ((.status | ascii_downcase) == "up")' >/dev/null; then
            echo "::error::Post-deploy health check failed: expected status 'up' in response body"
            exit 1
          fi

          echo "✅ Testnet API is live and healthy (status: up)."

